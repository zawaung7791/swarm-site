# nginx inside the container: serves the static site
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        # Always check for a newer version, so updates show up straight away
        add_header Cache-Control "no-cache";
    }
}
